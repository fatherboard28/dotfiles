unbind C-a
set-option -g prefix C-w

bind d split-window -h
bind f split-window -v
unbind '"'
unbind %

bind r source-file ~/.tmux.conf

bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

set -g mouse on

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#colors:
#Background: #232634
#Color:      #bac2de

# panes
set -g pane-border-style 'fg=#232634'
set -g pane-active-border-style 'fg=#bac2de'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#232634 fg=#bac2de'
set -g status-left ''
set -g status-right ''
set -g status-left-length 20
set -g status-right-length 0

setw -g window-status-current-style 'bg=#bac2de fg=#232634 bold'
setw -g window-status-current-format '#[fg=#232634]#I #[fg=#232634]#W '

setw -g window-status-style 'fg=#bac2de bg=#232634'
setw -g window-status-format '#[fg=#bac2de]#I #[fg=#bac2de]#W '


set-option -as terminal-features ",xterm-256color:RGB""

# messages
set -g message-style 'fg=#bac2de bg=#232634 bold'

set -sg escape-time 0
set-option -g focus-events on

run '~/.tmux/plugins/tpm/tpm'
